<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script>
  document.getElementById("contact-form").addEventListener("submit", function(e){
    e.preventDefault();
    var nome = this.nome.value.trim();
    var email = this.email.value.trim();
    var assunto = this.assunto.value.trim();
    var mensagem = this.mensagem.value.trim();
    var texto = "Olá! Meu nome é " + nome + " (" + email + (assunto ? ", " + assunto : "") + ").\n\n" + mensagem;
    window.open("https://web.whatsapp.com/send?phone=5511993386348&text=" + encodeURIComponent(texto), "_blank", "noopener");
  });
</script>
